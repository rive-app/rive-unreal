name: Build Unreal Plugin Source Release (Pre-built runtime binaries for GH and FAB)

on:
  schedule:
    - cron: "0 15 * * 6"
  workflow_dispatch:
    inputs:
      pluginTag:
        description: 'Rive Unreal version tag to build source packages from.'
        required: true
        type: string
      riveTag:
        description: 'Rive Runtime version tag to build source packages from.'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event }} 

env:
  RUNTIME_REF: ${{ inputs.riveTag || 'main' }}
  PLUGIN_REF:  ${{ inputs.pluginTag || 'main' }}
  VERSION_NAME: ${{ inputs.pluginTag || 'weekly' }}
  WEEKLY_INFIX: -weekly_
  RELEASE_TITLE: Latest Weekly Release

jobs:
  pre-run:
    runs-on: [self-hosted, Linux]
    outputs:
      PLUGIN_SHA: ${{ steps.resolve_refs.outputs.plugin_sha }}
      RUNTIME_SHA: ${{ steps.resolve_refs.outputs.runtime_sha }}
      BASE_VERSION: ${{ steps.base_version.outputs.version }}
    steps:
      - name: "Clean up old directories and files"
        id: cleanup
        shell: bash
        run: |
          rm -rf RiveUnreal
          rm -rf RiveRuntime
          rm -rf downloaded
    
      - name: "Resolve latest published release version"
        id: base_version
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_VERSION=$(gh release list -R rive-app/rive-unreal --json tagName,isPrerelease,publishedAt --jq \
            '[.[] | select(.isPrerelease == false)] | sort_by(.publishedAt) | last | .tagName // empty')
          if [ -z "$BASE_VERSION" ]; then
            echo "::error::Could not find a published, non-prerelease release on rive-app/rive-unreal to base the weekly tag on."
            exit 1
          fi
          echo "Basing this weekly release on the latest published release: $BASE_VERSION"
          echo "version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: "Reuse today's weekly release refs, if this is a same-day retry"
        id: reuse
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_VERSION: ${{ steps.base_version.outputs.version }}
        run: |
          DATE="$(date -u +%Y_%m_%d)"
          TAG="${BASE_VERSION}${WEEKLY_INFIX}${DATE}"
          BODY=$(gh release view "$TAG" -R rive-app/rive-unreal --json body --jq '.body' 2>/dev/null || true)
          REFS_JSON=$(printf '%s' "$BODY" | grep -o '<!-- weekly-release-refs: .*-->' | sed -E 's/<!-- weekly-release-refs: (.*) -->/\1/')
          if [ -n "$REFS_JSON" ]; then
            echo "Same-day retry detected for $TAG; reusing its recorded refs instead of re-resolving main."
            echo "plugin_ref=$(printf '%s' "$REFS_JSON" | jq -r '.pluginSha')" >> "$GITHUB_OUTPUT"
            echo "runtime_ref=$(printf '%s' "$REFS_JSON" | jq -r '.runtimeSha')" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        name: Check out Rive Plugin Source
        with:
          clean: true
          repository: "rive-app/rive-unreal"
          path: "RiveUnreal"
          ref: "${{ steps.reuse.outputs.plugin_ref || env.PLUGIN_REF }}"
          
      - uses: actions/checkout@v7
        name: Check out Rive Runtime Source
        with:
          clean: true
          lfs: true
          repository: "rive-app/rive-runtime"
          path: "RiveRuntime"
          ref: "${{ steps.reuse.outputs.runtime_ref || env.RUNTIME_REF }}"
          submodules: 'recursive'
          fetch-tags: true
          
      - name: "Resolve Refs"
        id: resolve_refs
        shell: bash
        run: |
          pushd RiveUnreal
          plugin_sha=$(git rev-parse HEAD)
          echo "plugin_sha=$plugin_sha" >> $GITHUB_OUTPUT;
          popd
          pushd RiveRuntime
          runtime_sha=$(git rev-parse HEAD)
          echo "runtime_sha=$runtime_sha" >> $GITHUB_OUTPUT;
          

  build-runtime-win64:
    runs-on: [self-hosted, Windows]
    continue-on-error: true
    outputs:
      builtRuntime: ${{ steps.build-step-win64.outputs.rive-runtime-artifacts-id }}
    needs: pre-run
    steps:
      - uses: $/.github/actions/build-runtime
        name: Build Runtime [WINDOWS]
        id: build-step-win64
        with:
          platform: "Windows"
          plugin-ref: "${{needs.pre-run.outputs.PLUGIN_SHA}}"
          runtime-ref: "${{needs.pre-run.outputs.RUNTIME_SHA}}"

  build-runtime-macos:
    runs-on: [self-hosted, rive-mini]
    continue-on-error: true
    outputs:
      builtRuntime: ${{ steps.build-step-macos.outputs.rive-runtime-artifacts-id }}
    needs: pre-run
    steps:
      - uses: $/.github/actions/build-runtime
        name: Build Runtime [MACOS]
        id: build-step-macos
        with:
          platform: "Mac"
          plugin-ref: "${{needs.pre-run.outputs.PLUGIN_SHA}}"
          runtime-ref: "${{needs.pre-run.outputs.RUNTIME_SHA}}"

  build-runtime-linux_ue5_6:
    runs-on: [self-hosted, linux, X64, unreal-linux]
    concurrency:
      group: runtime_linux
    continue-on-error: true
    outputs:
      builtRuntime: ${{ steps.build-step-linux.outputs.rive-runtime-artifacts-id }}
    needs: pre-run
    steps:
      - uses: $/.github/actions/build-runtime
        name: Build Runtime [LINUX]
        id: build-step-linux
        with:
          platform: "Linux"
          plugin-ref: "${{needs.pre-run.outputs.PLUGIN_SHA}}"
          runtime-ref: "${{needs.pre-run.outputs.RUNTIME_SHA}}"
          unreal-version: "5.6"

  build-runtime-linux_ue5_7:
    runs-on: [self-hosted, linux, X64, unreal-linux]
    concurrency:
      group: runtime_linux
    continue-on-error: true
    outputs:
      builtRuntime: ${{ steps.build-step-linux.outputs.rive-runtime-artifacts-id }}
    needs: pre-run
    steps:
      - uses: $/.github/actions/build-runtime
        name: Build Runtime [LINUX]
        id: build-step-linux
        with:
          platform: "Linux"
          plugin-ref: "${{needs.pre-run.outputs.PLUGIN_SHA}}"
          runtime-ref: "${{needs.pre-run.outputs.RUNTIME_SHA}}"
          unreal-version: "5.7"

  build-runtime-linux_ue5_8:
    runs-on: [self-hosted, linux, X64, unreal-linux]
    concurrency:
      group: runtime_linux
    continue-on-error: true
    outputs:
      builtRuntime: ${{ steps.build-step-linux.outputs.rive-runtime-artifacts-id }}
    needs: pre-run
    steps:
      - uses: $/.github/actions/build-runtime
        name: Build Runtime [LINUX]
        id: build-step-linux
        with:
          platform: "Linux"
          plugin-ref: "${{needs.pre-run.outputs.PLUGIN_SHA}}"
          runtime-ref: "${{needs.pre-run.outputs.RUNTIME_SHA}}"
          unreal-version: "5.8"

  build-runtime-android:
    runs-on: [self-hosted, Linux]
    continue-on-error: true
    outputs:
      builtRuntime: ${{ steps.build-step-android.outputs.rive-runtime-artifacts-id }}
    needs: pre-run
    steps:
      - uses: $/.github/actions/build-runtime
        name: Build Runtime [ANDROID]
        id: build-step-android
        with:
          platform: "Android"
          plugin-ref: "${{needs.pre-run.outputs.PLUGIN_SHA}}"
          runtime-ref: "${{needs.pre-run.outputs.RUNTIME_SHA}}"

  build-runtime-ios:
    runs-on: [self-hosted, rive-mini]
    continue-on-error: true
    outputs:
      builtRuntime: ${{ steps.build-step-ios.outputs.rive-runtime-artifacts-id }}
    needs: pre-run
    steps:
      - uses: $/.github/actions/build-runtime
        name: Build Runtime [IOS]
        id: build-step-ios
        with:
          platform: "iOS"
          plugin-ref: "${{needs.pre-run.outputs.PLUGIN_SHA}}"
          runtime-ref: "${{needs.pre-run.outputs.RUNTIME_SHA}}"

  check-runtime-builds:
    runs-on: [self-hosted, Linux]
    if: ${{ always() && needs.pre-run.result == 'success' }}
    needs: [pre-run,build-runtime-win64,build-runtime-macos,build-runtime-linux_ue5_6,build-runtime-linux_ue5_7,build-runtime-linux_ue5_8,build-runtime-android,build-runtime-ios]
    steps:
      - name: Require at least one platform runtime build to have succeeded
        shell: bash
        run: |
          if [ -z "${{ needs.build-runtime-win64.outputs.builtRuntime }}" ] && \
             [ -z "${{ needs.build-runtime-macos.outputs.builtRuntime }}" ] && \
             [ -z "${{ needs.build-runtime-linux_ue5_6.outputs.builtRuntime }}" ] && \
             [ -z "${{ needs.build-runtime-linux_ue5_7.outputs.builtRuntime }}" ] && \
             [ -z "${{ needs.build-runtime-linux_ue5_8.outputs.builtRuntime }}" ] && \
             [ -z "${{ needs.build-runtime-android.outputs.builtRuntime }}" ] && \
             [ -z "${{ needs.build-runtime-ios.outputs.builtRuntime }}" ]; then
            echo "::error::All platform runtime builds failed; halting packaging."
            exit 1
          fi

  assemble-fab-package:
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - ue_version: "5.6"
            ue_job_suffix: "5_6"
          - ue_version: "5.7"
            ue_job_suffix: "5_7"
          - ue_version: "5.8"
            ue_job_suffix: "5_8"
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.pre-run.result == 'success' && needs.check-runtime-builds.result == 'success' }}
    needs: [pre-run,build-runtime-win64,build-runtime-macos,build-runtime-linux_ue5_6,build-runtime-linux_ue5_7,build-runtime-linux_ue5_8,build-runtime-android,build-runtime-ios,check-runtime-builds]
    steps:
      - uses: $/.github/actions/create-source-packages
        name: Create Source Packages (FAB)
        with:
          RUNTIME_REF: ${{ needs.pre-run.outputs.RUNTIME_SHA }}
          PLUGIN_REF: ${{ needs.pre-run.outputs.PLUGIN_SHA }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          BUILD_WINDOWS: ${{ needs.build-runtime-win64.outputs.builtRuntime }}
          BUILD_MACOS: ${{ needs.build-runtime-macos.outputs.builtRuntime }}
          BUILD_LINUX: ${{ needs[format('build-runtime-linux_ue{0}', matrix.ue_job_suffix)].outputs.builtRuntime }}
          BUILD_ANDROID: ${{ needs.build-runtime-android.outputs.builtRuntime }}
          BUILD_IOS: ${{ needs.build-runtime-ios.outputs.builtRuntime }}
          PACKAGE_FOR_FAB: 'true'
          UE_VERSION: ${{ matrix.ue_version }}
          GH_TOKEN: ${{ secrets.COUNT_RELEASES_TOKEN }}
          FAB_URL: ${{secrets.FAB_URL }}

  assemble-gh-package_ue_5_6:
    runs-on: [self-hosted, Linux]
    if: ${{ always() && needs.pre-run.result == 'success' && needs.check-runtime-builds.result == 'success' }}
    needs: [pre-run,build-runtime-win64,build-runtime-macos,build-runtime-linux_ue5_6,build-runtime-android,build-runtime-ios,check-runtime-builds]
    outputs:
      sourcePackageId: ${{ steps.create-source-package.outputs.SourceArtifact }}
    steps:
      - uses: $/.github/actions/create-source-packages
        name: Create Source Packages (GH)
        id: create-source-package
        with:
          RUNTIME_REF: ${{ needs.pre-run.outputs.RUNTIME_SHA }}
          PLUGIN_REF: ${{ needs.pre-run.outputs.PLUGIN_SHA }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          BUILD_WINDOWS: ${{ needs.build-runtime-win64.outputs.builtRuntime }}
          BUILD_MACOS: ${{ needs.build-runtime-macos.outputs.builtRuntime }}
          BUILD_LINUX: ${{ needs['build-runtime-linux_ue5_6'].outputs.builtRuntime }}
          BUILD_ANDROID: ${{ needs.build-runtime-android.outputs.builtRuntime }}
          BUILD_IOS: ${{ needs.build-runtime-ios.outputs.builtRuntime }}
          UE_VERSION: "5.6"
          GH_TOKEN: ${{ secrets.COUNT_RELEASES_TOKEN }}

  assemble-gh-package_ue_5_7:
    runs-on: [self-hosted, Linux]
    if: ${{ always() && needs.pre-run.result == 'success' && needs.check-runtime-builds.result == 'success' }}
    needs: [pre-run,build-runtime-win64,build-runtime-macos,build-runtime-linux_ue5_7,build-runtime-android,build-runtime-ios,check-runtime-builds]
    outputs:
      sourcePackageId: ${{ steps.create-source-package.outputs.SourceArtifact }}
    steps:
      - uses: $/.github/actions/create-source-packages
        name: Create Source Packages (GH)
        id: create-source-package
        with:
          RUNTIME_REF: ${{ needs.pre-run.outputs.RUNTIME_SHA }}
          PLUGIN_REF: ${{ needs.pre-run.outputs.PLUGIN_SHA }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          BUILD_WINDOWS: ${{ needs.build-runtime-win64.outputs.builtRuntime }}
          BUILD_MACOS: ${{ needs.build-runtime-macos.outputs.builtRuntime }}
          BUILD_LINUX: ${{ needs['build-runtime-linux_ue5_7'].outputs.builtRuntime }}
          BUILD_ANDROID: ${{ needs.build-runtime-android.outputs.builtRuntime }}
          BUILD_IOS: ${{ needs.build-runtime-ios.outputs.builtRuntime }}
          UE_VERSION: "5.7"
          GH_TOKEN: ${{ secrets.COUNT_RELEASES_TOKEN }}


  assemble-gh-package_ue_5_8:
    runs-on: [self-hosted, Linux]
    if: ${{ always() && needs.pre-run.result == 'success' && needs.check-runtime-builds.result == 'success' }}
    needs: [pre-run,build-runtime-win64,build-runtime-macos,build-runtime-linux_ue5_8,build-runtime-android,build-runtime-ios,check-runtime-builds]
    outputs:
      sourcePackageId: ${{ steps.create-source-package.outputs.SourceArtifact }}
    steps:
      - uses: $/.github/actions/create-source-packages
        name: Create Source Packages (GH)
        id: create-source-package
        with:
          RUNTIME_REF: ${{ needs.pre-run.outputs.RUNTIME_SHA }}
          PLUGIN_REF: ${{ needs.pre-run.outputs.PLUGIN_SHA }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          BUILD_WINDOWS: ${{ needs.build-runtime-win64.outputs.builtRuntime }}
          BUILD_MACOS: ${{ needs.build-runtime-macos.outputs.builtRuntime }}
          BUILD_LINUX: ${{ needs['build-runtime-linux_ue5_8'].outputs.builtRuntime }}
          BUILD_ANDROID: ${{ needs.build-runtime-android.outputs.builtRuntime }}
          BUILD_IOS: ${{ needs.build-runtime-ios.outputs.builtRuntime }}
          UE_VERSION: "5.8"
          GH_TOKEN: ${{ secrets.COUNT_RELEASES_TOKEN }}


  update-weekly-release:
    runs-on: [self-hosted, Linux]
    permissions:
      contents: write
    if: ${{ always() && github.event_name == 'schedule' && needs.pre-run.result == 'success' && needs.assemble-gh-package_ue_5_6.result == 'success' && needs.assemble-gh-package_ue_5_7.result == 'success' && needs.assemble-gh-package_ue_5_8.result == 'success' }}
    needs: [pre-run,assemble-gh-package_ue_5_6,assemble-gh-package_ue_5_7,assemble-gh-package_ue_5_8]
    steps:
      - uses: actions/download-artifact@v8
        name: Download Binaries
        continue-on-error: true
        with:
          path: downloaded
          artifact-ids: ${{ needs.assemble-gh-package_ue_5_6.outputs.sourcePackageId }},${{ needs.assemble-gh-package_ue_5_7.outputs.sourcePackageId }},${{ needs.assemble-gh-package_ue_5_8.outputs.sourcePackageId }} 
          skip-decompress: true

      # The zip names aren't known ahead of time, so find them. Three are
      # expected: one GH source package per Linux-supported UE version.
      - name: Locate zips
        id: zip
        run: |
          mapfile -t zips < <(find downloaded -type f -iname '*.zip' -exec realpath {} + | sort)
          if [ "${#zips[@]}" -ne 3 ]; then
            echo "::error::Expected exactly three .zips in the downloaded artifact, found ${#zips[@]}"
            find downloaded -type f -exec realpath {} +
            exit 1
          fi
          for z in "${zips[@]}"; do
            echo "Found zip: $z"
          done
          {
            echo "paths<<ZIP_EOF"
            printf '%s\n' "${zips[@]}"
            echo "ZIP_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        name: Check out Rive Plugin Source
        with:
          clean: true
          repository: "rive-app/rive-unreal"
          path: "RiveUnreal"
          ref: "${{ needs.pre-run.outputs.PLUGIN_SHA }}"

      - name: Set release variables
        id: vars
        env:
          BASE_VERSION: ${{ needs.pre-run.outputs.BASE_VERSION }}
        run: |
          DATE="$(date -u +%Y_%m_%d)"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag=${BASE_VERSION}${WEEKLY_INFIX}${DATE}" >> "$GITHUB_OUTPUT"

      - name: Find previous weekly release
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd RiveUnreal
          PREV_TAG=$(gh release list --json tagName,isPrerelease,publishedAt --jq \
            '[.[] | select(.isPrerelease == true)] | sort_by(.publishedAt) | last | .tagName // empty')
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update "Latest Weekly Release"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          DATE: ${{ steps.vars.outputs.date }}
          ZIP_PATHS: ${{ steps.zip.outputs.paths }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
          PLUGIN_SHA: ${{ needs.pre-run.outputs.PLUGIN_SHA }}
          RUNTIME_SHA: ${{ needs.pre-run.outputs.RUNTIME_SHA }}
        run: |
          cd RiveUnreal
          mapfile -t ZIPS <<< "$ZIP_PATHS"
          REFS_MARKER="<!-- weekly-release-refs: {\"pluginSha\":\"${PLUGIN_SHA}\",\"runtimeSha\":\"${RUNTIME_SHA}\"} -->"
          MANUAL_NOTES="${REFS_MARKER}
          Weekly release built from ${PLUGIN_SHA} on ${DATE}."

          NOTES_FLAGS=(--notes "$MANUAL_NOTES" --generate-notes)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            NOTES_FLAGS+=(--notes-start-tag "$PREV_TAG")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same-day retry: an earlier attempt already created this release
            # (and, as a side effect, its tag). Never touch the tag - a tag
            # that a third party may already have fetched is never moved or
            # recreated here. Just make sure every zip's asset and the notes
            # are current.
            echo "Release $TAG already exists; updating it instead of recreating."
            for ZIP_PATH in "${ZIPS[@]}"; do
              ZIP_NAME="$(basename "$ZIP_PATH")"
              if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$ZIP_NAME"; then
                # Asset is already attached (e.g. only the notes/title failed
                # to apply last time) - --clobber deletes before it re-uploads,
                # so skip it here rather than risk losing a good asset to a
                # transient failure on a re-upload nothing actually needed.
                echo "Asset $ZIP_NAME is already attached to $TAG; leaving it as-is."
              else
                echo "Asset $ZIP_NAME is missing from $TAG; uploading it."
                gh release upload "$TAG" "$ZIP_PATH" --clobber
              fi
            done
            gh release edit "$TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$MANUAL_NOTES" \
              --prerelease
          else
            # No tag is created ahead of time. gh creates the tag and the
            # release together in a single call, pointed at $PLUGIN_SHA, so
            # a tag is never pushed unless its release is also created -
            # nothing for a same-day retry to collide with or roll back.
            gh release create "$TAG" "${ZIPS[@]}" \
              --target "$PLUGIN_SHA" \
              --title "$RELEASE_TITLE" \
              "${NOTES_FLAGS[@]}" \
              --prerelease
          fi

      - name: Delete old weekly release(s)
        # Disabled for now: we're keeping every weekly release instead of
        # pruning old ones. The logic below is kept up to date so this can
        # be re-enabled later just by removing this condition.
        if: false
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 10
        run: |
          # Keep the newest $KEEP weekly (prerelease) releases by publish
          # time (accounting for the one this run is about to create),
          # delete the rest. Tags are intentionally left in place so old
          # weekly builds stay reproducible/referenceable.
          cd RiveUnreal
          gh release list --limit 200 --json tagName,isPrerelease,publishedAt --jq \
            '[.[] | select(.isPrerelease == true)] | sort_by(.publishedAt) | reverse | .[(env.KEEP | tonumber):] | .[].tagName' |
          while read -r tag; do
            echo "Deleting release: $tag"
            gh release delete "$tag" --yes
          done
